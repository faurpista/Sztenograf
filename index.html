<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI LSB Szteganográfia + AES Titkosítás</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2.2rem; color: #fff; margin-bottom: 0.5rem; }
    header p { color: var(--text-muted); }

    .tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; justify-content: center; }
    .tab-btn {
      padding: 0.75rem 1.5rem; background: var(--card-bg); border: 1px solid var(--border);
      color: var(--text); font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); }

    .panel { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .panel.active { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

    @media (max-width: 768px) {
      .panel.active { grid-template-columns: 1fr; }
    }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
    input[type="text"], input[type="password"], textarea, input[type="file"] {
      width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 0.95rem;
    }
    textarea { resize: vertical; min-height: 90px; }

    .source-options { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .source-options label { cursor: pointer; color: var(--text); font-weight: normal; }

    button.btn-primary {
      width: 100%; padding: 0.85rem; background: var(--accent); color: white; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s;
    }
    button.btn-primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .preview-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px dashed var(--border); border-radius: 8px; padding: 1rem; min-height: 250px; background: #0f172a;
    }
    .preview-box canvas { max-width: 100%; max-height: 300px; border-radius: 6px; object-fit: contain; }

    .status { margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-muted); text-align: center; }
    .result-text { background: #0f172a; border: 1px solid var(--border); padding: 1rem; border-radius: 6px; white-space: pre-wrap; word-break: break-word; min-height: 100px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Szteganográfia + AES-256</h1>
      <p>Rejts el AES titkosítással ellátott üzenetet képekbe LSB módszerrel</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('encode')">🔒 Titkosítás és Elrejtés</button>
      <button class="tab-btn" onclick="switchTab('decode')">🔓 Visszafejtés</button>
    </div>

    <!-- ELREJTÉS PANEL -->
    <div id="encode-panel" class="panel active">
      <div>
        <div class="form-group">
          <label>Kép forrása</label>
          <div class="source-options">
            <label><input type="radio" name="imgSource" value="ai" checked onchange="toggleSource()"> AI Generálás</label>
            <label><input type="radio" name="imgSource" value="upload" onchange="toggleSource()"> Saját Feltöltés</label>
          </div>
        </div>

        <div id="ai-input-group" class="form-group">
          <label for="aiPrompt">AI Prompt (angolul)</label>
          <input type="text" id="aiPrompt" placeholder="Pl.: Cyberpunk neon city in rain">
        </div>

        <div id="upload-input-group" class="form-group" style="display: none;">
          <label for="uploadInput">Kép kiválasztása (PNG / JPG)</label>
          <input type="file" id="uploadInput" accept="image/*">
        </div>

        <div class="form-group">
          <label for="secretMessage">Elrejtendő Titkos Szöveg</label>
          <textarea id="secretMessage" placeholder="Írd ide a bizalmas üzenetet..."></textarea>
        </div>

        <div class="form-group">
          <label for="encodePassword">Titkosítási Jelszó (AES-256)</label>
          <input type="password" id="encodePassword" placeholder="Adjon meg egy erős jelszót...">
        </div>

        <button class="btn-primary" id="encodeBtn" onclick="processEncode()">Titkosítás, Rejtés és Generálás</button>
        <div id="encodeStatus" class="status"></div>
      </div>

      <div>
        <label>Eredmény (Szteganografált PNG)</label>
        <div class="preview-box">
          <canvas id="encodeCanvas" style="display:none;"></canvas>
          <span id="encodePlaceholder" style="color: var(--text-muted)">A menthető kép itt fog megjelenni</span>
        </div>
        <button class="btn-primary" id="downloadBtn" style="margin-top: 1rem; display: none;" onclick="downloadImage()">PNG Letöltése</button>
      </div>
    </div>

    <!-- VISSZAFEJTÉS PANEL -->
    <div id="decode-panel" class="panel">
      <div>
        <div class="form-group">
          <label for="decodeFileInput">Szteganografált PNG Feltöltése</label>
          <input type="file" id="decodeFileInput" accept="image/png">
        </div>

        <div class="form-group">
          <label for="decodePassword">Jelszó a Visszafejtéshez</label>
          <input type="password" id="decodePassword" placeholder="Írd be a titkosítási jelszót...">
        </div>

        <button class="btn-primary" onclick="processDecode()">Szöveg Visszafejtése</button>
        <div id="decodeStatus" class="status"></div>
      </div>

      <div>
        <label>Kiolvasott és Decryptelt Üzenet</label>
        <div id="decodedOutput" class="result-text">A kiolvasott szöveg itt jelenik meg...</div>
      </div>
    </div>
  </div>

  <script>
    // Tab váltás
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      
      if (tab === 'encode') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('encode-panel').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('decode-panel').classList.add('active');
      }
    }

    // Forrás választás
    function toggleSource() {
      const isAI = document.querySelector('input[name="imgSource"]:checked').value === 'ai';
      document.getElementById('ai-input-group').style.display = isAI ? 'block' : 'none';
      document.getElementById('upload-input-group').style.display = isAI ? 'none' : 'block';
    }

    // --- CRYPTO SEGÉDFUNKCIÓK (AES-GCM-256 + PBKDF2) ---
    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptText(plainText, password) {
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16)); // 16 bájt Só
      const iv = crypto.getRandomValues(new Uint8Array(12));   // 12 bájt IV
      const key = await getCryptoKey(password, salt);

      const encryptedContent = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(plainText)
      );

      // Összefűzés: Salt (16B) + IV (12B) + Titkosított Adat
      const combined = new Uint8Array(salt.length + iv.length + encryptedContent.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encryptedContent), salt.length + iv.length);

      return combined;
    }

    async function decryptBytes(combinedBytes, password) {
      if (combinedBytes.length < 28) {
        throw new Error("Az adatok túl rövidek vagy nem tartalmaznak AES fejlécet.");
      }

      const salt = combinedBytes.slice(0, 16);
      const iv = combinedBytes.slice(16, 28);
      const data = combinedBytes.slice(28);

      const key = await getCryptoKey(password, salt);

      try {
        const decryptedContent = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          data
        );

        const dec = new TextDecoder();
        return dec.decode(decryptedContent);
      } catch (e) {
        throw new Error("Hibás jelszó vagy sérült adatok!");
      }
    }

    // --- LSB SZTEGANOGRÁFIA LOGIKA ---
    function bytesToBits(bytes) {
      const len = bytes.length;
      const bits = [];

      // 32-bites Hossz Fejléc (Big-Endian)
      for (let i = 31; i >= 0; i--) {
        bits.push((len >> i) & 1);
      }

      for (let b of bytes) {
        for (let i = 7; i >= 0; i--) {
          bits.push((b >> i) & 1);
        }
      }
      return bits;
    }

    function embedBitsInImageData(imageData, bits) {
      const data = imageData.data;
      if (bits.length > (data.length / 4) * 3) {
        throw new Error("A titkosított üzenet túl nagy ehhez a képhez!");
      }

      let bitIdx = 0;
      for (let i = 0; i < data.length && bitIdx < bits.length; i++) {
        if ((i + 1) % 4 === 0) continue; // Alpha csatorna átugrása

        data[i] = (data[i] & 0xFE) | bits[bitIdx];
        bitIdx++;
      }
      return imageData;
    }

    function extractBytesFromImageData(imageData) {
      const data = imageData.data;

      // 1. Első 32 bit beolvasása (hossz meghatározása)
      let lengthBits = 0;
      let bitCount = 0;
      let i = 0;

      while (bitCount < 32 && i < data.length) {
        if ((i + 1) % 4 === 0) { i++; continue; }
        lengthBits = (lengthBits << 1) | (data[i] & 1);
        bitCount++;
        i++;
      }

      const msgByteLength = lengthBits >>> 0;

      if (msgByteLength <= 0 || msgByteLength > (data.length / 4) * 3) {
        throw new Error("Nem található érvényes rejtett adat a képben.");
      }

      // 2. Bájtok kiolvasása
      const bytes = new Uint8Array(msgByteLength);
      let currentByte = 0;
      let bitsInByte = 0;
      let byteIdx = 0;

      while (byteIdx < msgByteLength && i < data.length) {
        if ((i + 1) % 4 === 0) { i++; continue; }

        currentByte = (currentByte << 1) | (data[i] & 1);
        bitsInByte++;

        if (bitsInByte === 8) {
          bytes[byteIdx] = currentByte;
          byteIdx++;
          currentByte = 0;
          bitsInByte = 0;
        }
        i++;
      }

      return bytes;
    }

    // --- ELREJTÉSI FOLYAMAT ---
    async function processEncode() {
      const status = document.getElementById('encodeStatus');
      const text = document.getElementById('secretMessage').value;
      const password = document.getElementById('encodePassword').value;
      const source = document.querySelector('input[name="imgSource"]:checked').value;
      const encodeBtn = document.getElementById('encodeBtn');

      if (!text) { alert("Kérlek adj meg elrejtendő szöveget!"); return; }
      if (!password) { alert("Kérlek adj meg egy jelszót az AES titkosításhoz!"); return; }

      encodeBtn.disabled = true;
      status.innerText = "Kép töltése és AES titkosítás...";

      try {
        // 1. Titkosítás
        const encryptedBytes = await encryptText(text, password);

        // 2. Kép betöltése
        let img = new Image();
        img.crossOrigin = "anonymous";

        if (source === 'ai') {
          const prompt = document.getElementById('aiPrompt').value || 'abstract art background';
          const seed = Math.floor(Math.random() * 100000);
          img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${seed}&nologo=true`;
        } else {
          const fileInput = document.getElementById('uploadInput');
          if (!fileInput.files[0]) throw new Error("Válassz ki egy képet a feltöltéshez!");
          img.src = URL.createObjectURL(fileInput.files[0]);
        }

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("Nem sikerült betölteni a képet."));
        });

        // 3. Canvas feldolgozás
        const canvas = document.getElementById('encodeCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const bits = bytesToBits(encryptedBytes);

        embedBitsInImageData(imageData, bits);
        ctx.putImageData(imageData, 0, 0);

        document.getElementById('encodePlaceholder').style.display = 'none';
        canvas.style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'block';

        status.innerText = "Sikeres AES titkosítás és LSB elrejtés!";
      } catch (err) {
        alert("Hiba: " + err.message);
        status.innerText = "Hiba történt.";
      } finally {
        encodeBtn.disabled = false;
      }
    }

    function downloadImage() {
      const canvas = document.getElementById('encodeCanvas');
      const link = document.createElement('a');
      link.download = 'encrypted_stego.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // --- VISSZAFEJTÉSI FOLYAMAT ---
    async function processDecode() {
      const fileInput = document.getElementById('decodeFileInput');
      const password = document.getElementById('decodePassword').value;
      const output = document.getElementById('decodedOutput');
      const status = document.getElementById('decodeStatus');

      if (!fileInput.files[0]) { alert("Kérlek tölts fel egy PNG képet!"); return; }
      if (!password) { alert("A visszafejtéshez meg kell adnod a jelszót!"); return; }

      status.innerText = "Kép elemezése és AES dekódolás...";
      
      try {
        const img = new Image();
        img.src = URL.createObjectURL(fileInput.files[0]);

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("Érvénytelen képfájl."));
        });

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        // 1. LSB bájtok kinyerése
        const encryptedBytes = extractBytesFromImageData(imageData);

        // 2. AES-256 visszafejtés a jelszóval
        const decodedText = await decryptBytes(encryptedBytes, password);

        output.innerText = decodedText;
        status.innerText = "Sikeres visszafejtés!";
      } catch (err) {
        output.innerText = "";
        status.innerText = "";
        alert("Hiba: " + err.message);
      }
    }
  </script>
</body>
</html>
